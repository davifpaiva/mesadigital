<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mesa Digital RPG</title>

<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=IM+Fell+English&family=MedievalSharp&family=Uncial+Antiqua&family=Almendra&family=Pirata+One&family=Metamorphous&display=swap">
<style>
:root{--ink:#120c06;--parch:#ecd9a8;--gold:#c9922e;--or:#ff7a1a;--red:#d6322a;--deep:#1a110a;--fh:'Cinzel',Georgia,serif;--fb:'IM Fell English',Georgia,serif}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:var(--deep);color:var(--parch);font:16px var(--fb);overflow:hidden;user-select:none}
button,input,select{font:inherit;color:inherit;outline:0}
input,select{width:100%;background:#150d07;border:1px solid #5a3a1c;border-radius:8px;padding:8px 10px;transition:.15s}
input:focus,select:focus{border-color:var(--or);box-shadow:0 0 0 3px #ff7a1a33}input[type=color]{padding:2px;height:38px;cursor:pointer}
.b{display:block;width:100%;text-align:center;cursor:pointer;border:1px solid var(--ink);border-radius:10px;padding:10px 14px;background:linear-gradient(#f3e2b4,#d4b676);color:var(--ink);font:700 13px var(--fh);letter-spacing:.04em;box-shadow:0 2px 0 #7a5420,0 6px 12px #0005;transition:transform .12s,box-shadow .12s,filter .12s}
.b:hover{filter:brightness(1.08);transform:translateY(-1px)}.b:active{transform:translateY(2px);box-shadow:none}
.b.pri{background:linear-gradient(#ff9a3d,#e0620f);color:#fff;text-shadow:0 1px 0 #7a2e00}
#lobby{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 30% 15%,#f0b04a,#b8731d 45%,#3a2010)}
.card{width:min(420px,92vw);padding:28px;background:linear-gradient(#2c1c10,#1d120a);border:2px solid var(--gold);border-radius:18px;box-shadow:0 0 0 6px var(--ink),0 30px 70px #000a;display:grid;gap:12px;text-align:center;animation:fi .5s}
.card label{text-align:left}.card #salas{display:grid;gap:6px}
h1{margin:0;font:700 34px var(--fh);letter-spacing:.06em;text-shadow:0 3px 0 #000}.sub{margin:-6px 0 4px;color:#c9ae78;font-style:italic}
.sun{width:84px;height:84px;margin:auto;filter:drop-shadow(0 4px 8px #0008)}
label{display:block;font-size:13px;color:#c9ae78;margin-bottom:3px}
#app{position:fixed;inset:0}canvas{display:block;touch-action:none}canvas.mv{cursor:grab}canvas.mt{cursor:pointer}canvas.ru,canvas.dw,canvas.fr,canvas.fh{cursor:crosshair}
#vg{position:fixed;inset:0;pointer-events:none;box-shadow:inset 0 0 180px #000c}
.ui{background:linear-gradient(#2a1a0f,#1c120a);border:2px solid var(--gold);box-shadow:0 0 0 4px var(--ink),0 18px 40px #0009}
#bar{position:fixed;bottom:18px;left:calc((100% - 352px)/2);transform:translateX(-50%);display:flex;gap:3px;align-items:center;padding:7px 9px;border-radius:16px;transition:left .3s;max-width:calc(100vw - 20px);overflow-x:auto}
body.sc #bar,body.sc #hint,body.sc #dice{left:50%}
.t{display:grid;place-items:center;width:58px;height:52px;border:0;border-radius:10px;background:0;cursor:pointer;font-size:20px;line-height:1;transition:.15s;flex:none}
.t small{font:600 8.5px var(--fh);letter-spacing:.05em;margin-top:3px}.t:hover{background:#3b2512}.t:active{transform:scale(.94)}
.t.on{background:linear-gradient(#ff9a3d,#e0620f);color:#fff;box-shadow:inset 0 0 0 1px #ffd9a8}
#col{width:38px;flex:none;margin:0 4px}.sep{width:1px;height:36px;background:#5a3a1c;margin:0 5px;flex:none}

#tg{position:fixed;top:20px;right:20px;width:42px;padding:7px 0;z-index:30}
#side{position:fixed;top:12px;right:12px;bottom:12px;width:min(328px,calc(100vw - 24px));display:flex;flex-direction:column;border-radius:18px;transform-origin:right top;transition:transform .25s,opacity .25s,visibility .25s;overflow:hidden}#side.c{opacity:0;visibility:hidden;pointer-events:none;transform:scale(.92)}
#hd{display:flex;gap:10px;align-items:center;padding:12px 60px 12px 12px;border-bottom:1px solid #5a3a1c}#hd .sun{width:44px;height:44px;margin:0;flex:none}
#rn{font:700 16px var(--fh);color:var(--or);margin-bottom:4px}#pl{display:flex;gap:4px;flex-wrap:wrap}#pl span{background:#3b2512;border:1px solid #6b4620;border-radius:99px;padding:0 9px;font-size:12px}

#tabs small{display:block;font:600 8.5px var(--fh);letter-spacing:.06em}#tabs button.on{color:var(--or);border-color:var(--or);background:#24160c}
.pn{display:none;padding:14px;overflow:auto;flex:1}.pn.on{display:block;animation:fi .25s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.pn>*{margin-bottom:10px}.row{display:flex;gap:8px}.row>*{flex:1}small{color:#a98a57;font-size:13px;display:block}
.rb{display:block;width:fit-content;background:linear-gradient(#f3e2b4,#d4b676);color:var(--ink);font:700 12px var(--fh);letter-spacing:.06em;padding:4px 20px;clip-path:polygon(0 0,100% 0,calc(100% - 9px) 50%,100% 100%,0 100%,9px 50%);margin:4px 0 10px}
.it{display:flex;align-items:center;gap:9px;width:100%;padding:9px 12px;margin-bottom:6px;background:#34210f;border:1px solid #5a3a1c;border-radius:10px;cursor:pointer;text-align:left;transition:.15s}
.it:hover{border-color:var(--or);background:#3f2812}.it.on{border-color:var(--or);background:#4a2d12;box-shadow:inset 3px 0 0 var(--or)}.it b{flex:1;font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it i{width:16px;height:16px;border-radius:50%;border:2px solid var(--ink);flex:none}.it .x{color:var(--red);padding:0 4px}
#qk{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}#qk .b{padding:9px 0}#log div{padding:6px 10px;background:#34210f;border-radius:8px;margin-bottom:4px;font-size:14px}#log b{color:var(--or)}
body.p .m{display:none!important}
#dice{position:fixed;left:calc((100% - 352px)/2);top:14%;transform:translateX(-50%);text-align:center;background:#120c06e6;border:2px solid var(--gold);border-radius:18px;padding:6px 30px 16px;pointer-events:none;box-shadow:0 20px 60px #000a;z-index:6;transition:left .3s;animation:fi .3s}
#dice p{margin:4px 0 0;font:700 16px var(--fh)}#dice b{color:var(--or);font-size:28px}
.sc{perspective:700px;display:inline-block;margin:16px 12px}.cube{width:70px;height:70px;position:relative;transform-style:preserve-3d;transition:transform 1.4s cubic-bezier(.2,.8,.2,1)}
.cube i{position:absolute;inset:0;display:grid;place-items:center;font:700 26px var(--fh);background:radial-gradient(circle at 30% 25%,#f8ecc6,#d4b676);color:var(--ink);border:2px solid var(--gold);font-style:normal}
.cube i:nth-child(1){transform:translateZ(35px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(35px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(35px)}
.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(35px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(35px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(35px)}
canvas.tx{cursor:text}#ctx{position:fixed;top:18px;left:calc((100% - 352px)/2);transform:translateX(-50%);display:flex;gap:3px;padding:6px;border-radius:14px;transition:left .3s;z-index:4}body.sc #ctx{left:50%}
#dlg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;z-index:20}#dlg .card{text-align:left}#fp{font-size:22px;padding:8px;text-align:center;background:#150d07;border-radius:8px;margin-top:6px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.b.dng{background:linear-gradient(#e0483f,#9e1f18);color:#fff}
#ctx{transition:opacity .15s}
@media(max-width:760px){#bar,#hint,#dice{left:50%}#hint{white-space:normal;width:max-content;max-width:90vw;text-align:center}}
</style></head><body>
<svg width=0 height=0 style="position:absolute"><symbol id=sunS viewBox="0 0 100 100"><circle cx=50 cy=50 r=48 fill=#1f4a2f stroke=#120c06 stroke-width=3 /><polygon points="50,6 57.7,31.5 81.1,18.9 68.5,42.3 94,50 68.5,57.7 81.1,81.1 57.7,68.5 50,94 42.3,68.5 18.9,81.1 31.5,57.7 6,50 31.5,42.3 18.9,18.9 42.3,31.5" fill=#f5e43a stroke=#120c06 stroke-width=2 /><circle cx=50 cy=50 r=11 fill=#f5e43a stroke=#120c06 stroke-width=2 /><circle cx=50 cy=50 r=3.5 fill=#120c06 /></symbol></svg>
<div id=lobby><div class=card><svg class=sun><use href="#sunS"/></svg><h1>Mesa Digital</h1><p class=sub>Sua mesa de RPG online</p>
<div><label>Apelido</label><input id=nick placeholder="Como o grupo te chama?"></div><div><label>Código da sala</label><input id=code placeholder="ex.: costa-das-baleias"></div>

<button class=t data-t=tx title="Texto (T)">🔤<small>TEXTO</small></button><label class=t title="Imagem na mesa">🖼<small>IMAGEM</small><input type=file id=if accept="image/*" hidden></label><input type=color id=col value=#ff6a2b title="Cor do desenho / texto"><button class=t id=un title="Desfazer (Ctrl+Z)">↶<small>DESFAZER</small></button><button class=t id=rd title="Refazer (Ctrl+Y)">↷<small>REFAZER</small></button>
<span class="sep m"></span><button class="t m" data-t=fr title="Revelar névoa (F)">🌤<small>REVELAR</small></button><button class="t m" data-t=fh title="Cobrir com névoa (C)">🌑<small>COBRIR</small></button><button class="t m" data-t=mt title="Montaria (M)">🐎<small>MONTARIA</small></button></div>
<button id=tg class=b title="Painel (Tab)">☰</button>
<div id=side class=ui><div id=hd><svg class=sun><use href="#sunS"/></svg><div><div id=rn></div><div id=pl></div></div></div>
<div id=tabs><button class=on data-p=pm>🗺<small>MAPAS</small></button><button class=m data-p=pt>🎭<small>TOKENS</small></button><button data-p=pd>🎲<small>DADOS</small></button><button data-p=pa>📎<small>ANEXOS</small></button><button data-p=ps>⚙<small>SALA</small></button></div>
<div class="pn on" id=pm><span class=rb>MAPAS DA SALA</span><div id=ml></div><label class="b m">＋ Novo mapa<input type=file id=mf accept="image/*" hidden></label><small>★ é o mapa que está na mesa. Toque no mapa na mesa para arrastar, girar, redimensionar e bloquear 🔒. Jogadores podem espiar os outros só para si.</small></div>
<div class="pn m" id=pt><span class=rb>NOVO TOKEN</span><div><label>Nome</label><input id=tn placeholder="Ex.: Goblin, Kira..."></div>
<div class=row><div><label>Cor</label><input id=tc type=color value=#d94b2b></div><div><label>Tamanho</label><select id=ts><option value=1>Médio (1)<option value=2>Grande (2)<option value=3>Enorme (3)<option value=4>Colossal (4)</select></div></div>
<div><label>Tipo</label><select id=tp><option value=0>Monstro<option value=1>Jogador (jogadores movem)</select></div><div><label>Fonte do nome</label><select id=tfo></select><div id=fp></div></div><div><label>Imagem (opcional)</label><input id=tf type=file accept="image/*"></div>
<button id=addt class="b pri">＋ Adicionar à mesa</button><span class=rb>NA MESA</span><div id=tl></div><small>Del apaga o token selecionado.</small></div>
<div class=pn id=pd><span class=rb>ROLAR DADOS</span><div class=row><div><label>Quantidade</label><input id=dq type=number value=1 min=1 max=10></div><div><label>Lados</label><input id=ds type=number value=20 min=2 max=100></div></div>
<button class="b pri" onclick="roll(+dq.value,+ds.value)">🎲 ROLAR</button><div id=qk></div><span class=rb>HISTÓRICO</span><div id=log></div></div>
<div class=pn id=pa><span class=rb>ANEXOS</span><div id=fl></div><label class="b m">＋ Anexar arquivo<input type=file id=ff hidden></label></div>
<div class=pn id=ps><span class=rb>CONVITE</span><button class="b pri" onclick="navigator.clipboard.writeText(location.origin+location.pathname+'?sala='+code);toast('Convite copiado!')">🔗 Copiar link de convite</button>
<div class=m><span class=rb>MUNDO</span><label>Cor do fundo</label><input type=color id=bgc><label style="margin-top:8px">Metros por casa</label><input type=number id=cm step=.5 placeholder="ex.: 1.5">
<button class=b style="margin-top:10px" onclick="act({t:'fc'});act({t:'fg',o:{x:-1e6,y:-1e6,w:2e6,h:2e6,c:1}})">🌑 Cobrir mapa todo</button><button class=b style="margin-top:8px" onclick="act({t:'fc'})">🌤 Revelar mapa todo</button><button class=b style="margin-top:8px" onclick="act({t:'dc'})">🧽 Limpar desenhos</button><button class="b dng" style="margin-top:18px" onclick="delRoom()">🗑 Excluir sala definitivamente</button></div></div></div>
<div id=ctx class=ui hidden><button class=t id=cpin>🔒<small>BLOQUEAR</small></button><button class=t id=czf title="Trazer para frente">⬆<small>FRENTE</small></button><button class=t id=czb title="Enviar para trás">⬇<small>FUNDO</small></button><button class=t id=cdu>⧉<small>DUPLICAR</small></button><button class=t id=cdel>🗑<small>EXCLUIR</small></button></div>
<div id=dlg hidden><div class="card ui"><span class=rb id=dt></span><input id=di><div class=row id=do><select id=df></select><select id=dz><option value=.8>Pequeno<option value=1 selected>Médio<option value=1.6>Grande<option value=2.4>Enorme</select></div><div class=row><button class=b id=dn>Cancelar</button><button class="b pri" id=dk>OK</button></div></div></div>
<div id=dice hidden></div></div>
<script>
const $=s=>document.querySelector(s),G=50,R=()=>Math.random().toString(36).slice(2,9),R3=()=>360+Math.random()*720|0,esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt()+';');
let M,code,nick,S,peer,host,conns=[],V={x:innerWidth/2-300,y:100,z:1},tool='mv',sel,local,names=[],cache={},imgs={},pend={},dg,dirty,dt;
const DB=new Promise(r=>{let q=indexedDB.open('mesa',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onsuccess=()=>r(q.result)});
const get=k=>DB.then(d=>new Promise(r=>{let q=d.transaction('k').objectStore('k').get(k);q.onsuccess=()=>r(q.result)}));
const put=(k,v)=>DB.then(d=>d.transaction('k','readwrite').objectStore('k').put(v,k));
const cv=$('canvas'),cx=cv.getContext('2d'),oc=document.createElement('canvas'),ox=oc.getContext('2d'),cm=()=>S&&S.maps[local||S.cur];
const O=m=>m.o||(m.o=[]),rm=k=>DB.then(d=>d.transaction('k','readwrite').objectStore('k').delete(k)),drop=a=>Promise.all(a.filter(Boolean).map(i=>{delete cache[i];return rm('b:'+i)}));
const ids=()=>{let a=[];Object.values(S.maps).forEach(m=>a.push(m.i,...m.k.map(k=>k.i),...O(m).map(o=>o.i)));S.files.forEach(f=>a.push(f.id));return a};
const rd=f=>new Promise(r=>{let a=new FileReader();a.onload=()=>r(a.result);a.readAsDataURL(f)});
async function store(f,sh){let d=await rd(f);if(sh)d=await new Promise(r=>{let i=new Image();i.onload=()=>{let k=Math.min(1,2400/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL('image/jpeg',.85))};i.src=d});let id=R();cache[id]=d;await put('b:'+id,d);return id}
function blob(id,cb){if(cache[id])return cb(cache[id]);get('b:'+id).then(d=>{if(d){cache[id]=d;cb(d)}else if(!M){(pend[id]=pend[id]||[]).push(cb);host.send({t:'need',id})}})}
function img(id){if(!imgs[id]){let i=imgs[id]=new Image();blob(id,d=>{i.onload=draw;i.src=d})}return imgs[id]}
function mv(m,t,dx,dy){t.x+=dx;t.y+=dy;m.k.forEach(k=>k.m==t.id&&mv(m,k,dx,dy))}
function apply(a){let m=S.maps[a.m]||{},t;switch(a.t){
case'mv':t=m.k.find(k=>k.id==a.id);t&&mv(m,t,a.x-t.x,a.y-t.y);break;
case'ad':m.k.push(a.k);break;
case'dl':m.k=m.k.filter(k=>k.id!=a.id);m.k.forEach(k=>k.m==a.id&&(k.m=null));break;
case'mt':t=m.k.find(k=>k.id==a.id);if(!t)break;if(a.p){let p=m.k.find(k=>k.id==a.p),c=p;while(c&&c!==t)c=m.k.find(k=>k.id==c.m);if(c)break;t.m=a.p;t.x=p.x;t.y=p.y}else t.m=null;break;
case'fg':m.f.push(a.o);break;case'fc':m.f=[];break;case'dr':m.d.push(a.s);break;case'dc':m.d=[];break;case'du':m.d=m.d.filter(s=>s.id!=a.id);break;
case'oa':O(m).push(a.o);break;
case'om':t=O(m).find(o=>o.id==a.id);if(t){if(a.x!=null){t.x=a.x;t.y=a.y}if(a.w){t.w=a.w;t.h=a.h}if(a.r!=null)t.r=a.r}break;
case'od':t=O(m).find(o=>o.id==a.id);m.o=O(m).filter(o=>o.id!=a.id);t&&gc([t.i]);break;
case'oz':t=O(m).find(o=>o.id==a.id);if(t){m.o=O(m).filter(o=>o!==t);a.d=='f'?m.o.push(t):m.o.unshift(t)}break;
case'op':t=O(m).find(o=>o.id==a.id);if(t)t.pin=a.v;break;
case'md':{let x=S.maps[a.id];if(x){delete S.maps[a.id];if(S.cur==a.id)S.cur=Object.keys(S.maps)[0]||null;gc([x.i,...x.k.map(k=>k.i),...O(x).map(o=>o.i)])}}break;
case'fd':{let f=S.files.find(f=>f.id==a.id);S.files=S.files.filter(f=>f.id!=a.id);f&&gc([f.id])}break;
case'cu':S.cur=a.id;break;case'mp':S.maps[a.id]=a.o;S.cur=a.id;break;case'bg':S.bg=a.v;break;case'ce':S.cell=a.v;break;case'fl':S.files.push(a.f)}}
function act(a){a.m=a.m||local||S.cur;if(M){apply(a);push()}else host.send(a)}
function push(){if(M){names=[nick+' ★',...conns.filter(c=>c.n).map(c=>c.n)];put('room:'+code,S);conns.forEach(c=>c.open&&c.send({t:'st',s:S,w:names}))}ui();draw()}
function ui(){let cur=local||S.cur;$('#ml').innerHTML=Object.entries(S.maps).map(([id,m])=>`<button class="it ${id==cur?'on':''}" data-m="${id}">🗺 <b>${esc(m.n)}</b>${id==S.cur?'<span title="Mapa da mesa">★</span>':''}${M?`<span class=x data-xm="${id}">✕</span>`:''}</button>`).join('')||'<small>Nenhum mapa ainda.</small>';
$('#fl').innerHTML=S.files.map(f=>`<button class=it data-f="${f.id}">📎 <b>${esc(f.n)}</b>${M?`<span class=x data-xf="${f.id}">✕</span>`:''}</button>`).join('')||'<small>Nenhum anexo.</small>';
$('#pl').innerHTML=names.map(n=>`<span>${esc(n)}</span>`).join('');$('#rn').textContent=code;
let m=cm();$('#tl').innerHTML=m?m.k.map(t=>`<div class=it data-k="${t.id}"><i style="background:${t.c}"></i><b style="font-family:'${t.f||'Cinzel'}';font-size:18px">${esc(t.n)}</b>${M?'<span class=x data-x="'+t.id+'">✕</span>':''}</div>`).join('')||'<small>Nenhum token neste mapa.</small>':'';rsel()}
